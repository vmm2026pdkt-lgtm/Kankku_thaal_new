name: kanakku_thaal
description: கணக்கு தாள் — Tamil expense tracker (Flutter native app)
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # State management
  flutter_riverpod: ^2.5.1

  # Backend
  supabase_flutter: ^2.5.6

  # Local storage
  sqflite: ^2.3.3+1
  path: ^1.9.0
  path_provider: ^2.1.3
  shared_preferences: ^2.2.3
  flutter_secure_storage: ^9.2.2

  # Charts
  fl_chart: ^0.68.0

  # Export
  excel: ^4.0.2
  pdf: ^3.11.0
  printing: ^5.13.1
  file_picker: ^10.1.2
  share_plus: ^12.0.2

  # Misc
  intl: ^0.19.0
  url_launcher: ^6.3.0
  uuid: ^4.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#1A0B2E"
  adaptive_icon_foreground: "assets/icon/icon.png"

# Forces a newer app_links (a transitive dep of supabase_flutter, used for
# auth deep links) that supports the Android Gradle Plugin version bundled
# with recent Flutter releases. Older app_links versions fail to build with
# "compileSdkVersion is not specified" against newer AGP.
dependency_overrides:
  app_links: ^6.3.2
  file_picker: ^10.1.2

flutter:
  uses-material-design: true
  assets:
    - assets/icon/icon.png
    - assets/fonts/NotoSansTamil-Regular.ttf
