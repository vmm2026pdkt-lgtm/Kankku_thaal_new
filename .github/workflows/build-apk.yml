name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      # Generates the FULL android/ folder fresh (build.gradle, settings.gradle,
      # gradle wrapper, AndroidManifest.xml, etc.) matching this exact Flutter/AGP
      # version, so there's no mismatch between hand-edited files and the
      # generated Gradle build system (this caused the earlier build failures).
      - name: Generate Android platform files
        run: flutter create --platforms=android --project-name kanakku_thaal .

      # Patch the freshly generated AndroidManifest.xml: app label (Tamil) +
      # INTERNET permission (needed for Supabase network calls).
      - name: Patch AndroidManifest (label + internet permission)
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          sed -i 's/android:label="kanakku_thaal"/android:label="கணக்கு தாள்"/' "$MANIFEST"
          if ! grep -q 'android.permission.INTERNET' "$MANIFEST"; then
            sed -i 's#<manifest xmlns:android="http://schemas.android.com/apk/res/android">#<manifest xmlns:android="http://schemas.android.com/apk/res/android">\n    <uses-permission android:name="android.permission.INTERNET"/>#' "$MANIFEST"
          fi
          cat "$MANIFEST"

      - name: Get packages
        run: flutter pub get

      - name: Build APK (release)
        run: flutter build apk --release

      - name: Build AAB (release, for Play Store)
        run: flutter build appbundle --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: kanakku-thaal-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: kanakku-thaal-aab
          path: build/app/outputs/bundle/release/app-release.aab
