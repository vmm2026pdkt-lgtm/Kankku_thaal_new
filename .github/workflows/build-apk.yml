name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      # Fills in any missing Android/iOS platform scaffolding
      # (build.gradle, gradle wrapper, etc.) without touching
      # files that already exist in this repo (e.g. AndroidManifest.xml).
      - name: Ensure Android platform files exist
        run: flutter create --platforms=android .

      - name: Get packages
        run: flutter pub get

      - name: Build APK (release)
        run: flutter build apk --release

      - name: Build AAB (release, for Play Store)
        run: flutter build appbundle --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: kanakku-thaal-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: kanakku-thaal-aab
          path: build/app/outputs/bundle/release/app-release.aab
